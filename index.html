<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo1</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.cs
s">
</head>
<body class="p-4">
    <form class="vstack gap-3"novalidate>
        <div>
            <label for="dni" class="form-label fs-5">Numero de DNI</label>
            <input id="dni" class="form-control form-control-lg"
                    inputmode="nummeric" aria-describedby="dni-ayuda" >
            <div id="dni-ayuda" class="form-text">
                8 digitos. Puedes usar espacios
            </div>
        </div>

    <div class="btn-group" role="group" aria-label="Modalidad">
        <input type="radio" class="btn-check" name="modo" id="presencial" checked>
        <label class="btn btn-outline-primary btn-lg"
        for="presencial">Presencial</label>
        <input type="radio" class="btn-check" name="modo" id="virtual">
        <label class="btn btn-outline-primary btn-lg" for="virtual">Virtual</label>
    </div> 
    <button type="submit" class="btn btn-primary btn-lg focus ring">Enviar solicitud</button>
    <p class="visually-hidden" role="status" id="aviso"></p>
    </form>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle
.min.js"></script>
</body>
</html>
